name: Build RTerminal bootstrap (CI only)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap_archives.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'repo.json'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild packages even when cached package markers exist'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: rterminal-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bootstrap ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout package recipes
        uses: actions/checkout@v7

      - name: Restore source/toolchain downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.termux-build/_cache
            ~/.termux-build/*/cache
          key: rterminal-bootstrap-src-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/properties.sh', 'scripts/build-bootstraps.sh', 'scripts/Dockerfile', 'packages/**/build.sh') }}
          restore-keys: |
            rterminal-bootstrap-src-v1-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build bootstrap from this fork's package sources
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          args=(--architectures "$ARCH")
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            args=(-f "${args[@]}")
          fi
          ./scripts/run-docker.sh -m ./scripts/build-bootstraps.sh "${args[@]}"

      - name: Verify archive and write checksum/manifest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="bootstrap-${ARCH}.zip"
          test -s "$archive"
          unzip -t "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          image_digest="$(docker image inspect "$TERMUX_BUILDER_IMAGE_NAME" --format='{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null | sed -n '1p' || true)"
          if [[ -z "$image_digest" ]]; then image_digest="unavailable:${TERMUX_BUILDER_IMAGE_NAME}"; fi
          apt_sources="$(unzip -p "$archive" etc/apt/sources.list | tr '\n' ' ')"
          if grep -Eq 'packages(-cf)?\.termux\.dev' <<< "$apt_sources"; then
            echo '::warning::Bootstrap still points at upstream Termux APT; do not distribute or run pkg update against it.'
          fi
          cat > "bootstrap-${ARCH}.manifest.txt" <<EOF
          source_commit=${GITHUB_SHA}
          architecture=${ARCH}
          application_id=com.reloot.rterminal
          builder_image=${TERMUX_BUILDER_IMAGE_NAME}
          builder_image_digest=${image_digest}
          archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f1)
          apt_sources=${apt_sources}
          EOF
          cat "bootstrap-${ARCH}.manifest.txt"

      - name: Explain artifact status
        shell: bash
        run: |
          {
            echo '## RTerminal bootstrap artifact — CI only'
            echo
            echo 'This archive is built for `com.reloot.rterminal`, but is not a release. The package fork still points to upstream Termux APT sources; do not use `pkg update` or distribute this archive until a matching RTerminal APT repository is built, signed, and configured.'
            echo
            echo 'Only source/toolchain downloads are cached. Package build markers and `.deb` outputs are rebuilt in a clean runner to avoid stale binaries.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI-only bootstrap artifact
        uses: actions/upload-artifact@v7
        with:
          name: rterminal-bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-${{ matrix.arch }}.zip
            bootstrap-${{ matrix.arch }}.zip.sha256
            bootstrap-${{ matrix.arch }}.manifest.txt
          if-no-files-found: error
          retention-days: 7
